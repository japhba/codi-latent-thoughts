[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codi-latent-thoughts"
version = "0.1.0"
description = "Code, data and figures for What's in CODI's latent thoughts?"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = ["numpy==2.2.6", "matplotlib==3.10.8", "tqdm==4.67.3", "python-dotenv==1.2.2", "playwright==1.49.1"]

[project.optional-dependencies]
gpu = ["torch==2.10.0", "transformers==4.57.6", "peft==0.19.1", "huggingface-hub==0.36.2", "safetensors==0.7.0", "accelerate==1.12.0"]
judge = ["httpx==0.28.1"]
training = ["datasets==4.8.3", "pyarrow==23.0.1", "pyyaml==6.0.3", "wandb==0.25.0", "anthropic==0.84.0"]

[tool.setuptools.packages.find]
include = ["codi_repro*"]

[tool.uv]
package = false
